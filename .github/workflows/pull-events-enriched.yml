name: Pull Events COMPLETE PE + Fast Food + Sport

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Pull FREE 100+ OSM Venues + Fast Food
        run: python pull_osm_free.py
        continue-on-error: false

      - name: Pull Sport Events - Dance, Gymnastics, Competitions
        run: python pull_sport_events.py
        continue-on-error: true

      - name: Pull Quicket (if exists)
        run: if [ -f pull_quicket.py ]; then python pull_quicket.py; fi
        continue-on-error: true

      - name: Commit ALL
        run: |
          git config user.name "fomo-bot"
          git config user.email "bot@fomo1700.com"
          git add events.json
          git diff --cached --quiet || git commit -m "Update ALL PE: 300+ venues + fast food + sport (dance, gymnastics)"
          git push
