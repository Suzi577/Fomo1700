name: FOMO ENRICHED - Spotify + Menu + Push

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  enriched-pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install
        run: pip install requests beautifulsoup4 lxml
        
      - name: Pull & Enrich
        run: |
          python pull_events_ENRICHED.py || python pull_events_ALL_SOURCES.py || python pull_events.py
          cat pull_log.json || echo "No log"
          echo "Total: $(cat events.json | grep -c '\"id\"')"
          
      - name: Commit
        run: |
          git config --local user.email "fomo-enriched@gqeberha.app"
          git config --local user.name "FOMO Enriched Bot"
          git add events.json events_enriched.json new_events.json pull_log.json 2>/dev/null || git add .
          if git diff --staged --quiet; then
            echo "No changes"
          else
            COUNT=$(cat events.json | grep -c '"id"')
            git commit -m "🤖 ENRICHED: $(date +'%Y-%m-%d %H:%M') - $COUNT events"
            git push
          fi
