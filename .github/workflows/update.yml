name: Update FOMO Events Daily
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-events:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Fetch live events
        run: python quicket_importer.py
      - name: Commit
        run: |
          git config user.name "FOMO Bot"
          git config user.email "bot@fomo.gq"
          git add events.json
          git commit -m "auto: update Gqeberha events $(date +'%Y-%m-%d')" || echo "no changes"
          git push
