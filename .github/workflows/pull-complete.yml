name: Pull COMPLETE - ALL Categories 300+

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours

jobs:
  pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install requests
        run: pip install requests

      - name: Pull ALL - Restaurants, Bars, Fast Food, DJ, Kids, Teens, Pets, Food Specials - 334 venues
        run: python pull_all_events.py

      - name: Commit 300+ events
        run: |
          git config user.name "fomo-bot"
          git config user.email "bot@fomo1700.com"
          git add events.json
          git diff --cached --quiet || git commit -m "Update ALL categories: 334 venues - restaurants, bars, cafes, fast food, DJ, kids, teens, young adults, pets, food specials - REAL photos, transparent mascots"
          git push
