<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOMO • Gqeberha - 334 Events</title>
<style>
:root { --pink:#ff3b82; }
body { background:#0a0a14; color:white; font-family:-apple-system,BlinkMacSystemFont,sans-serif; margin:0; padding-bottom:90px; }
.header { padding:18px 16px 8px 16px; display:flex; justify-content:space-between; align-items:center; background:#0a0a14; position:sticky; top:0; z-index:10; }
.logo { display:flex; align-items:center; gap:10px; }
.logo-icon { width:56px; height:56px; background:transparent; border-radius:16px; display:flex; align-items:center; justify-content:center; overflow:visible; }
.logo-icon img { width:56px; height:56px; object-fit:contain; background:transparent; }
.search { background:#151525; border-radius:24px; padding:14px 18px; display:flex; gap:12px; margin:12px 16px; border:1px solid #25253a; }
.search input { background:transparent; border:none; color:white; width:100%; outline:none; font-size:14px; }
.chips { display:flex; gap:8px; padding:0 16px 12px 16px; overflow-x:auto; }
.chips::-webkit-scrollbar { display:none; }
.chip { background:#151525; padding:10px 16px; border-radius:20px; font-size:13px; white-space:nowrap; border:1px solid #2a2a45; cursor:pointer; flex-shrink:0; display:flex; align-items:center; gap:6px; }
.chip.active { background:var(--pink); border-color:var(--pink); font-weight:bold; }
.chip img { width:20px; height:20px; object-fit:contain; background:transparent; }
.time-row { display:flex; gap:8px; padding:0 16px 14px 16px; }
.time-chip { flex:1; background:#151525; padding:12px 4px; border-radius:12px; text-align:center; font-size:12px; cursor:pointer; border:1px solid #25253a; }
.time-chip.active { background:var(--pink); border-color:var(--pink); }
.section { padding:12px 16px 8px 16px; display:flex; justify-content:space-between; align-items:center; }
.section-left { display:flex; align-items:center; gap:10px; }
.section-left img { width:42px; height:42px; object-fit:contain; background:transparent; }
.event-grid-card { background:#1a1a2e; border-radius:18px; padding:12px; margin:12px 16px; border:1px solid #25253a; cursor:pointer; border-top:3px solid var(--pink); }
.event-grid-card img.main { width:100%; height:200px; border-radius:14px; object-fit:cover; background:#151525; display:block; }
.meta { color:#8a8aa0; font-size:12px; line-height:1.4; margin-top:4px; }
.card { background:#1a1a2e; margin:10px 16px; border-radius:18px; padding:12px; display:flex; gap:12px; border:1px solid #25253a; cursor:pointer; }
.card img { width:86px; height:86px; border-radius:14px; object-fit:cover; background:#151525; flex-shrink:0; }
.bottom-nav { position:fixed; bottom:0; left:0; right:0; background:rgba(10,10,20,0.98); backdrop-filter:blur(20px); border-top:1px solid #1e1e30; display:flex; justify-content:space-around; padding:10px 0 20px 0; z-index:50; }
.nav-item { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10px; color:#6a6a8a; cursor:pointer; padding:4px 12px; border-radius:12px; }
.nav-item.active { color:white; background:#1a1a2e; }
.add-btn { width:56px; height:56px; background:linear-gradient(135deg,#ff6b35,var(--pink)); border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:28px; color:white; margin-top:-20px; cursor:pointer; box-shadow:0 4px 20px rgba(255,59,130,0.4); }
.add-btn:active { transform:scale(0.92); }
.modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:#0a0a14; z-index:100; overflow-y:auto; }
.modal.active { display:block; }
.modal-header { position:relative; border-top:4px solid var(--pink); }
.modal-header img { width:100%; height:300px; object-fit:cover; display:block; background:#151525; }
.modal-back { position:absolute; top:16px; left:16px; background:rgba(0,0,0,0.7); width:44px; height:44px; border-radius:22px; display:flex; align-items:center; justify-content:center; font-size:22px; cursor:pointer; }
.modal-mascot { position:absolute; bottom:-18px; right:20px; width:90px; height:90px; background:transparent; }
.modal-mascot img { width:90px; height:90px; object-fit:contain; background:transparent; filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5)); }
.modal-content { padding:20px 16px; }
.detail-badge { background:var(--pink); padding:6px 14px; border-radius:20px; font-size:11px; font-weight:bold; display:inline-block; margin-bottom:12px; }
.detail-title { font-size:24px; font-weight:bold; margin:0 0 12px 0; line-height:1.2; }
.detail-meta { color:#8a8aa0; font-size:14px; margin-bottom:16px; line-height:1.6; }
.detail-desc { background:#151525; border-radius:16px; padding:16px; margin-bottom:20px; line-height:1.6; font-size:14px; border:1px solid #25253a; border-left:3px solid var(--pink); }
.action-row { display:flex; gap:12px; margin-bottom:12px; }
.action-btn { flex:1; padding:16px; border-radius:16px; border:none; font-weight:bold; font-size:14px; cursor:pointer; }
.btn-maps { background:#1a73e8; color:white; }
.btn-ticket { background:linear-gradient(135deg,#ff6b35,var(--pink)); color:white; }
.btn-save { background:#1e1e30; color:white; border:1px solid #2a2a45; }
.loading { text-align:center; padding:60px 20px; color:#8a8aa0; }
.loading img { width:80px; height:80px; object-fit:contain; background:transparent; margin-bottom:16px; }
.error { background:#ff3b82; color:white; padding:16px; margin:16px; border-radius:12px; text-align:center; }
.empty-state { text-align:center; padding:40px 20px; }
.empty-state img { width:100px; height:100px; object-fit:contain; background:transparent; }
.saved-badge { background:#22c55e; color:white; padding:2px 8px; border-radius:10px; font-size:10px; margin-left:8px; }
</style>
</head>

function setCat(c){
  activeCat=c;
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
  const el = document.querySelector(`[data-cat="${c}"]`);
  if(el) el.classList.add('active');
  const mascotMap = {all:'magnify', restaurant:'pizza', fast_food:'burger', food_special:'pizza', bar:'cocktail', cafe:'magnify', dj:'music', sports:'burger', kids:'party', teens:'music', young_adults:'party', pets:'burger'};
  document.getElementById('sectionMascot').src = MASCOTS[mascotMap[c]||'magnify'];
  const names = {all:'Trending Near You 🔥', restaurant:'🍔 Restaurants', fast_food:'🍟 Fast Food', food_special:'🔥 Food Specials', bar:'🍺 Bars', cafe:'☕ Cafes', dj:'🎧 DJ Events', sports:'⚽ Sports', kids:'👶 Kids', teens:'🧑‍🎤 Teens', young_adults:'🎉 Young Adults', pets:'🐾 Pets'};
  document.getElementById('secTitle').textContent = names[c]||c.toUpperCase();
  render();
}
function setTime(t){ document.querySelectorAll('.time-chip').forEach(x=>x.classList.remove('active')); document.querySelector(`[data-time="${t}"]`).classList.add('active'); }

function render(){
  if (!data || data.length===0) return;
  let f=data;
  if(activeCat!=='all') f=f.filter(e=> (e.category||'').toLowerCase()===activeCat);
  const q=document.getElementById('search').value.toLowerCase().trim();
  if(q) f=f.filter(e=> (e.title+' '+(e.venue||'')+' '+(e.area||'')).toLowerCase().includes(q));
  if(document.getElementById('nav-saved').classList.contains('active')) {
    f = data.filter(e=> saved.includes(e.id));

function openEvent(id) {
  const ev = data.find(e=> String(e.id)===String(id));
  if(!ev) return;
  currentEvent = ev;
  document.getElementById('modalImg').src = img(ev);
  document.getElementById('modalTitle').textContent = ev.title;
  document.getElementById('modalCat').textContent = (ev.category||'EVENT').toUpperCase() + (ev.badge ? ' • '+ev.badge : '');
  document.getElementById('modalMeta').innerHTML = `📍 <strong>${ev.venue||''}</strong> ${ev.area ? '• '+ev.area : ''}<br>📏 ${ev.distance||''} ${ev.schedule ? '<br>📅 '+ev.schedule : ''}<br>📫 ${ev.address||''}`;
  document.getElementById('modalDesc').textContent = ev.description || 'Popular spot in Gqeberha';
  const mascotMap = {restaurant:'pizza', fast_food:'burger', food_special:'pizza', bar:'cocktail', cafe:'magnify', dj:'music', sports:'burger', kids:'party', teens:'music', young_adults:'party', pets:'burger'};
  document.getElementById('modalMascotImg').src = MASCOTS[mascotMap[(ev.category||'').toLowerCase()]||'party'];
  document.getElementById('eventModal').classList.add('active');
}

function closeModal() { document.getElementById('eventModal').classList.remove('active'); }
function closeAdd() { document.getElementById('addModal').classList.remove('active'); }
function openAddEvent() { document.getElementById('addModal').classList.add('active'); }

function submitAdd() {
  const title = document.getElementById('addTitle').value.trim();
  const cat = document.getElementById('addCat').value;
  const area = document.getElementById('addArea').value.trim() || 'Gqeberha';
  if(!title) { alert('Enter title'); return; }
  const newEv = {
    id: 'user-'+Date.now(),
    title: title,
    venue: title,
    area: area,
    category: cat,
    type: 'venue',
    description: `User added: ${title} in ${area}`,
    distance: '0.5 km',
    image: 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=600&h=400&fit=crop',
    address: area+', Gqeberha'
  };
  data.unshift(newEv);
  closeAdd();
  render();
  document.getElementById('addTitle').value='';
  document.getElementById('addArea').value='';
  alert('🔥 Added! '+title);
}

function saveEvent() {
  if(!currentEvent) return;
  const idx = saved.indexOf(currentEvent.id);
  if(idx>=0) {
    saved.splice(idx,1);
    alert('Removed from saved');
  } else {
    saved.push(currentEvent.id);
    alert('❤️ Saved!');
  }
  localStorage.setItem('fomo_saved', JSON.stringify(saved));
  updateSavedCount();
  render();
}

function updateSavedCount() {
  document.getElementById('savedCount').textContent = saved.length>0 ? `Saved (${saved.length})` : 'Saved';
}

function goHome() {
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('nav-home').classList.add('active');
  activeCat='all';
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
  document.querySelector('[data-cat="all"]').classList.add('active');
  document.getElementById('secTitle').textContent='Trending Near You 🔥';
  document.getElementById('search').value='';
  window.scrollTo({top:0, behavior:'smooth'});
  render();
}

function goExplore() {
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('nav-explore').classList.add('active');
  if(data.length>0) {
    const ev = data[Math.floor(Math.random()*Math.min(10,data.length))];
    const q = encodeURIComponent((ev.venue||'')+' '+(ev.area||'')+' Gqeberha');
    window.open(`https://www.google.com/maps/search/?api=1&query=${q}`, '_blank');
  } else {
    window.open('https://www.google.com/maps/search/restaurants+Gqeberha', '_blank');
  }
  setTimeout(()=>{ document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); document.getElementById('nav-home').classList.add('active'); }, 500);
}

function goSaved() {
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('nav-saved').classList.add('active');
  render();
}

function goProfile() {
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('nav-profile').classList.add('active');
  const total = data.length;
  const cats = {};
  data.forEach(e=>{ cats[e.category]=(cats[e.category]||0)+1; });
  let catList = Object.entries(cats).map(([k,v])=> `${k}: ${v}`).join('\\n');
  alert(`🔥 FOMO Profile\\n\\n📊 ${total} total events\\n❤️ ${saved.length} saved\\n\\n📍 Categories:\\n${catList}\\n\\nGqeberha's hottest spots!`);
  setTimeout(()=>{ document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); document.getElementById('nav-home').classList.add('active'); }, 500);
}

function openMaps() {
  if(!currentEvent) return;
  const query = encodeURIComponent((currentEvent.venue||'') + ' ' + (currentEvent.area||'') + ' Gqeberha');
  window.open(`https://www.google.com/maps/search/?api=1&query=${query}`, '_blank');
}

load();
</script>
