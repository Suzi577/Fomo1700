
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOMO • Gqeberha</title>
<style>
:root { --pink:#ff3b82; }
body { background:#0a0a14; color:white; font-family:-apple-system,sans-serif; margin:0; padding-bottom:90px; transition:background 0.5s ease; }
body.cat-food { background: radial-gradient(600px at 0% 0%, rgba(255,107,0,0.18), transparent), #0a0a14; }
body.cat-nightlife { background: radial-gradient(600px at 0% 0%, rgba(139,92,246,0.20), transparent), #0a0a14; }
body.cat-music { background: radial-gradient(600px at 0% 0%, rgba(236,72,153,0.20), transparent), #0a0a14; }
body.cat-festivals { background: radial-gradient(600px at 0% 0%, rgba(34,197,94,0.18), transparent), #0a0a14; }
.header { padding:18px 16px 8px 16px; display:flex; justify-content:space-between; align-items:center; }
.logo { display:flex; align-items:center; gap:10px; }
.logo-icon { width:52px; height:52px; background:#000000; border-radius:14px; display:flex; align-items:center; justify-content:center; overflow:hidden; border:1px solid #2a2a3a; box-shadow:0 0 0 1px rgba(255,59,130,0.4); }
.logo-icon img { width:48px; height:48px; object-fit:contain; }
.search { background:#151525; border-radius:24px; padding:14px 18px; display:flex; gap:12px; margin:12px 16px; border:1px solid #25253a; }
.search input { background:transparent; border:none; color:white; width:100%; outline:none; }
.chips { display:flex; gap:8px; padding:0 16px 10px 16px; overflow-x:auto; }
.chips::-webkit-scrollbar { display:none; }
.chip { background:#151525; padding:9px 16px; border-radius:20px; font-size:13px; white-space:nowrap; border:1px solid #2a2a45; cursor:pointer; display:flex; align-items:center; gap:6px; }
.chip.active { background:var(--pink); border-color:var(--pink); transform:scale(1.05); }
.chip img { width:20px; height:20px; }
.time-row { display:flex; gap:6px; padding:0 16px 14px 16px; }
.time-chip { flex:1; background:#151525; padding:10px 4px; border-radius:12px; text-align:center; font-size:11px; cursor:pointer; border:1px solid #25253a; }
.time-chip.active { background:var(--pink); }
.section { padding:12px 16px 8px 16px; display:flex; justify-content:space-between; align-items:center; }
.section-left { display:flex; align-items:center; gap:10px; }
.section-left img { width:38px; height:38px; }
.card { background:#1a1a2e; margin:10px 16px; border-radius:18px; padding:12px; display:flex; gap:12px; border:1px solid #25253a; cursor:pointer; border-top:3px solid #2a2a45; }
.card:hover { border-top-color:var(--pink); }
.card img { width:86px; height:86px; border-radius:14px; object-fit:cover; }
.event-grid-card { background:#1a1a2e; border-radius:18px; padding:12px; margin:10px 16px; border:1px solid #25253a; cursor:pointer; border-top:3px solid var(--pink); box-shadow:0 4px 0 0 rgba(255,59,130,0.15); }
.event-grid-card img.main { width:100%; height:170px; border-radius:14px; object-fit:cover; }
.meta { color:#8a8aa0; font-size:11px; }
.bottom-nav { position:fixed; bottom:0; left:0; right:0; background:rgba(10,10,20,0.95); backdrop-filter:blur(20px); border-top:1px solid #1e1e30; display:flex; justify-content:space-around; padding:10px 0 20px 0; z-index:50; }
.nav-item { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10px; color:#6a6a8a; }
.nav-item.active { color:white; }
.add-btn { width:56px; height:56px; background:linear-gradient(135deg,#ff6b35,var(--pink)); border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:28px; color:white; margin-top:-20px; }
.modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:#0a0a14; z-index:100; overflow-y:auto; }
.modal.active { display:block; }
.modal-header { position:relative; border-top:4px solid var(--pink); }
.modal-header img { width:100%; height:280px; object-fit:cover; }
.modal-back { position:absolute; top:16px; left:16px; background:rgba(0,0,0,0.7); width:40px; height:40px; border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer; }
.modal-mascot { position:absolute; bottom:-20px; right:20px; width:80px; height:80px; }
.modal-content { padding:20px 16px; }
.detail-badge { background:var(--pink); padding:6px 14px; border-radius:20px; font-size:11px; font-weight:bold; display:inline-block; margin-bottom:12px; }
.detail-title { font-size:22px; font-weight:bold; margin:0 0 12px 0; }
.detail-meta { color:#8a8aa0; font-size:13px; margin-bottom:16px; line-height:1.6; }
.detail-desc { background:#151525; border-radius:16px; padding:16px; margin-bottom:20px; line-height:1.6; font-size:14px; border:1px solid #25253a; border-left:3px solid var(--pink); }
.action-row { display:flex; gap:12px; margin-bottom:12px; }
.action-btn { flex:1; padding:16px; border-radius:16px; border:none; font-weight:bold; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
.btn-maps { background:#1a73e8; color:white; }
.btn-spotify { background:#1DB954; color:white; }
.btn-ticket { background:linear-gradient(135deg,#ff6b35,var(--pink)); color:white; }
.btn-save { background:#1e1e30; color:white; border:1px solid #2a2a45; }
.empty-state { text-align:center; padding:50px 20px; }
.empty-state img { width:120px; height:120px; }
.menu-box { background:#151525; border:1px solid #2a2a45; border-radius:16px; padding:16px; margin-top:12px; border-top:3px solid var(--pink); }
</style>
</head>

let data = [];
let activeCat = 'all';
let activeTime = 'all';
let currentEvent = null;

// ULTRA-ROBUST NORMALIZER - Fixes undefined!
function normalizeEvent(raw, idx) {
  // Try every possible field name
  const title = raw.title || raw.name || raw.event_name || raw.event_title || raw.summary || raw.eventName || raw.Name || raw.Title || raw.heading || "Untitled Event";
  const date = raw.date || raw.date_str || raw.date_string || raw.dateString || raw.event_date || raw.start_date || raw.startDate || raw.day || raw.when || "";
  const time = raw.time || raw.time_str || raw.start_time_formatted || raw.event_time || raw.startTime || "";
  const place = raw.place || raw.venue || raw.venue_name || raw.location || raw.location_name || raw.address || raw.where || raw.place_name || raw.venueName || "Gqeberha";
  const location = raw.location || raw.full_location || raw.address || raw.venue_address || place + ", Gqeberha";
  const image = raw.image || raw.image_url || raw.imageUrl || raw.thumbnail || raw.cover_image || raw.photo || raw.pic || raw.img || raw.picture || raw.image_src || "";
  const going = raw.going || raw.going_count || raw.attendees || raw.attending || raw.interested || Math.floor(Math.random()*200)+20;
  const distance = raw.distance || raw.dist_km || raw.km || "1.5 km";
  const category = (raw.category || raw.cat || raw.type || raw.event_type || "event").toLowerCase();
  const description = raw.description || raw.desc || raw.details || raw.summary || raw.event_description || title + " - Amazing event in Gqeberha!";
  const menu = raw.menu || raw.food_menu || "";
  const artist = raw.artist || raw.performer || raw.band || "";
  const url = raw.url || raw.link || raw.event_url || raw.ticket_url || raw.tickets_url || "";
  const hasRealUrl = url && !url.includes('example.com') && !url.includes('example.org') && url.startsWith('http');
  
  // Fix date if empty - try parse start_time
  let finalDate = date;
  let finalTime = time;
  if (!finalDate || finalDate === "undefined" || finalDate === "") {
    if (raw.start_time || raw.startTime || raw.datetime) {
      try {
        const d = new Date(raw.start_time || raw.startTime || raw.datetime);
        finalDate = d.toLocaleDateString('en-ZA', {day:'numeric', month:'short', year:'numeric'});
        finalTime = finalTime || d.toLocaleTimeString('en-ZA', {hour:'2-digit', minute:'2-digit'});
      } catch(e) { finalDate = "Soon"; }
    } else {
      finalDate = "Upcoming";
    }
  }
  
  // Fix image if empty - use unique picsum based on id/title
  let finalImage = image;
  if (!finalImage || finalImage === "" || finalImage.includes('undefined')) {
    const seed = (raw.id || idx || title).toString();
    const pics = [
      'https://images.unsplash.com/photo-1550547660-d9450f859349?w=600',
      'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600',
      'https://images.unsplash.com/photo-1470337458703-46ad1756a187?w=600',
      'https://images.unsplash.com/photo-1511192336575-5a79af67a629?w=600',
      'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=600',
      'https://images.unsplash.com/photo-1511512578047-dfb367046420?w=600',
      'https://images.unsplash.com/photo-1509248961158-e32f8f7eecf0?w=600',
      'https://images.unsplash.com/photo-1489944440615-453fc2b6a9a9?w=600'
    ];
    finalImage = pics[idx % pics.length] + '&seed=' + encodeURIComponent(seed);
  }

  // Detect category from title if generic
  let finalCat = category;
  if (finalCat === 'event' || !finalCat) {
    const lower = title.toLowerCase();
    if (lower.includes('burger') || lower.includes('pizza') || lower.includes('food') || lower.includes('braai')) finalCat = 'food';
    else if (lower.includes('cocktail') || lower.includes('bar') || lower.includes('club') || lower.includes('night')) finalCat = 'nightlife';
    else if (lower.includes('jazz') || lower.includes('music') || lower.includes('concert') || lower.includes('dj') || lower.includes('band')) finalCat = 'music';
    else if (lower.includes('rugby') || lower.includes('soccer') || lower.includes('sport')) finalCat = 'sports';
    else if (lower.includes('market') || lower.includes('festival') || lower.includes('convention') || lower.includes('geek')) finalCat = 'festivals';
    else if (lower.includes('hike') || lower.includes('tour') || lower.includes('beach') || lower.includes('outdoor')) finalCat = 'outdoors';
    else finalCat = 'festivals';
  }

  return {
    id: raw.id || idx,
    title: title,
    date: finalDate,
    time: finalTime || "19:00",
    place: place,
    location: location,
    image: finalImage,
    image_url: finalImage,
    going: going,
    distance: distance,
    category: finalCat,
    description: description,
    menu: menu,
    artist: artist,
    url: url,
    hasRealUrl: hasRealUrl,
    start_time: raw.start_time || raw.startTime || new Date().toISOString(),
    isLive: raw.isLive || false
  };
}

async function load() {
  try {
    const res = await fetch('events.json?v=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('no json');
    const rawData = await res.json();
    console.log('Raw events:', rawData.length, rawData[0]);
    data = rawData.map((e,i) => normalizeEvent(e,i));
    console.log('Normalized first:', data[0]);
  } catch(e) {
    console.log('Using fallback', e);
    data = [
      {id:1, title:"The Beer Yard - R79 Burger Tuesday", image:"https://images.unsplash.com/photo-1550547660-d9450f859349?w=600", date:"Today", time:"17:00", distance:"0.6 km", going:298, category:"food", place:"The Beer Yard, Richmond Hill", location:"The Beer Yard, PE", description:"Juicy 180g beef burger R79 every Tuesday!", menu:"🍔 Classic Beef R79, Double R99", start_time:new Date().toISOString(), url:"", hasRealUrl:false},
      {id:2, title:"Barney's Tavern - 2for1 Pizza", image:"https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600", date:"Tomorrow", time:"17:00", distance:"1.4 km", going:204, category:"food", place:"Barney's Tavern, Walmer", location:"Barney's Tavern, Walmer", description:"2 for 1 wood-fired pizzas!", menu:"🍕 Margherita R89", start_time:new Date(Date.now()+86400000).toISOString(), url:"", hasRealUrl:false}
    ].map((e,i)=> normalizeEvent(e,i));
  }

  const cats = [
    {id:'all', label:'All', count:data.length, mascot:'magnify'},
    {id:'food', label:'Food', mascot:'pizza'},
    {id:'nightlife', label:'Nightlife', mascot:'cocktail'},
    {id:'music', label:'Music', mascot:'music'},
    {id:'festivals', label:'Festivals', mascot:'party'},
    {id:'sports', label:'Sports', mascot:'burger'},
    {id:'outdoors', label:'Outdoors', mascot:'magnify'}
  ];
  document.getElementById('catChips').innerHTML = cats.map(c => `<div class="chip ${c.id==='all'?'active':''}" data-cat="${c.id}" onclick="setCat('${c.id}')"><img src="${MASCOTS[c.mascot]}"> ${c.label} ${c.count ? '• '+c.count : ''}</div>`).join('');
  render();
}

function img(e) { return e.image || e.image_url || 'https://picsum.photos/seed/'+e.id+'/600'; }
function isToday(e) { try { return new Date(e.start_time).toDateString()===new Date().toDateString() || (e.date||'').toLowerCase().includes('today'); } catch { return false; } }
function isWeek(e) { if(isToday(e)) return true; try { const d=(new Date(e.start_time)-new Date())/86400000; return d>=0&&d<=7; } catch { return false; } }
function isMonth(e) { if(isWeek(e)) return true; try { const ev=new Date(e.start_time); const now=new Date(); return ev.getMonth()===now.getMonth(); } catch { return false; } }
function isLater(e) { try { const ev=new Date(e.start_time); const next=new Date(new Date().getFullYear(), new Date().getMonth()+1,1); return ev>=next; } catch { return (e.date||'').includes('2026'); } }

function setCat(c){
  activeCat=c;
  document.body.className = c==='all' ? '' : 'cat-'+c;
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
  const el = document.querySelector(`[data-cat="${c}"]`);
  if(el) el.classList.add('active');
  const mascotMap = {all:'magnify', food:'pizza', nightlife:'cocktail', music:'music', festivals:'party', sports:'burger', outdoors:'magnify'};
  const secMascot = document.getElementById('sectionMascot');
  secMascot.src = MASCOTS[mascotMap[c]||'magnify'];
  secMascot.style.display = 'block';
  const names = {all:'Trending Near You 🔥', food:'🍔 Food Specials', nightlife:'🍸 Nightlife', music:'🎵 Live Music', festivals:'🎉 Festivals', sports:'⚽ Sports', outdoors:'🏖️ Outdoors'};
  document.getElementById('secTitle').textContent = names[c]||c;
  render();
}
function setTime(t){ activeTime=t; document.querySelectorAll('.time-chip').forEach(x=>x.classList.remove('active')); document.querySelector(`[data-time="${t}"]`).classList.add('active'); render(); }

function render(){
  let f=data;
  if(activeCat!=='all') f=f.filter(e=> (e.category||'').toLowerCase()===activeCat);
  if(activeTime==='today') f=f.filter(isToday);
  else if(activeTime==='week') f=f.filter(isWeek);
  else if(activeTime==='month') f=f.filter(isMonth);
  else if(activeTime==='later') f=f.filter(isLater);
  const q=document.getElementById('search').value.toLowerCase();
  if(q) f=f.filter(e=> (e.title+' '+(e.place||'')).toLowerCase().includes(q));
  document.getElementById('totalCount').textContent=f.length;
  document.getElementById('countDisplay').textContent=f.length+' events';

  if(f.length===0){
    document.getElementById('trending').innerHTML = `<div class="empty-state"><img src="${MASCOTS.confused}"><h3>No events in ${activeCat} - ${activeTime}</h3><p style="color:#8a8aa0;">Try another category</p></div>`;
    document.getElementById('allList').innerHTML='';
    return;
  }

  document.getElementById('trending').innerHTML = f.slice(0,3).map(ev=>`
    <div class="card" onclick="openEvent(${ev.id})">
      <img src="${img(ev)}"><div style="flex:1;"><h3 style="margin:0 0 6px 0; font-size:14px;">${ev.title}</h3><div class="meta">📅 ${ev.date} • 📍 ${ev.distance||ev.place} • 👥 ${ev.going} going</div></div><div style="color:#4a4a6a;">›</div>
    </div>
  `).join('');

  document.getElementById('allList').innerHTML = f.map(ev=>`
    <div class="event-grid-card" onclick="openEvent(${ev.id})">
      <div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span style="background:rgba(0,0,0,0.6); padding:5px 10px; border-radius:12px; font-size:11px;">${ev.date} • ${ev.time||'19:00'}</span><span style="background:${ev.category==='food'?'#ff6b00':'#ff3b82'}; padding:5px 10px; border-radius:12px; font-size:11px;">${(ev.category||'EVENT').toUpperCase()}</span></div>
      <img class="main" src="${img(ev)}">
      <h3 style="margin:8px 0 4px 0; font-size:14px;">${ev.title}</h3>
      <div class="meta">📍 ${ev.distance||'1.5 km'} • 👥 ${ev.going||23} going • ${ev.place||'Gqeberha'}</div>
    </div>
  `).join('');
}

function openEvent(id) {
  const ev = data.find(e=> e.id===id);
  if(!ev) return;
  currentEvent = ev;
  document.getElementById('modalImg').src = img(ev);
  document.getElementById('modalTitle').textContent = ev.title;
  document.getElementById('modalCat').textContent = (ev.category||'EVENT').toUpperCase();
  document.getElementById('modalMeta').innerHTML = `📅 ${ev.date} ${ev.time?'• '+ev.time:''}<br>📍 ${ev.place||ev.location||'Gqeberha'} ${ev.distance?'• '+ev.distance:''}<br>👥 ${ev.going||0} people going ${ev.isLive?'• 🔴 LIVE':''}`;
  document.getElementById('modalDesc').textContent = ev.description;
  
  const menuBox = document.getElementById('menuBox');
  if(ev.menu) {
    menuBox.style.display = 'block';
    menuBox.innerHTML = `<h4 style="margin:0 0 8px 0;">📋 Menu</h4><pre style="white-space:pre-wrap; font-family:inherit; margin:0; font-size:13px;">${ev.menu}</pre>`;
  } else { menuBox.style.display = 'none'; }
  
  const mascotMap = {food:'pizza', nightlife:'cocktail', music:'music', festivals:'party', sports:'burger', outdoors:'magnify'};
  document.getElementById('modalMascot').innerHTML = `<img src="${MASCOTS[mascotMap[ev.category]||'magnify']}" style="width:80px; height:80px;">`;
  
  const spotifyRow = document.getElementById('spotifyRow');
  if(ev.category==='music' || ev.artist) {
    spotifyRow.style.display = 'flex';
    document.getElementById('btnSpotify').textContent = `🎵 Play ${ev.artist||'on Spotify'}`;
  } else { spotifyRow.style.display = 'none'; }
  
  document.getElementById('eventModal').classList.add('active');
}

function closeModal() { document.getElementById('eventModal').classList.remove('active'); }
function openMaps() {
  if(!currentEvent) return;
  const query = encodeURIComponent(currentEvent.location || currentEvent.place || currentEvent.title + ' Gqeberha');
  window.open(`https://www.google.com/maps/search/?api=1&query=${query}`, '_blank');
}
function openSpotify() {
  if(!currentEvent) return;
  const artist = currentEvent.artist || currentEvent.title.split('-')[0] || currentEvent.title;
  window.open(`https://open.spotify.com/search/${encodeURIComponent(artist)}`, '_blank');
}
function openTickets() {
  if(!currentEvent) return;
  if(currentEvent.url && currentEvent.url.includes('example.com')) {
    document.getElementById('menuBox').style.display='block';
    document.getElementById('menuBox').innerHTML = `<h4>📋 Details</h4><p>${currentEvent.description}</p><pre>${currentEvent.menu||''}</pre>`;
    return;
  }
  if(currentEvent.hasRealUrl && currentEvent.url) {
    window.open(currentEvent.url, '_blank');
  } else {
    const box = document.getElementById('menuBox');
    box.style.display='block';
    if(!box.innerHTML) box.innerHTML = `<h4>📋 Details</h4><p>${currentEvent.description}</p>`;
    box.scrollIntoView({behavior:'smooth'});
  }
}

load();
</script>
</body>
